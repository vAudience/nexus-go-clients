        error_code:
          description: |-
            ErrorCode is the structured terminal error code for a failed file, drawn
            from the same vocabulary as the `code` of an error response (e.g.
            "corpus_token_quota_exceeded"), so the same condition reads identically
            whether it surfaced as an HTTP error or as a status on a file. Two values
            occur only here -- "corpus_processing_failed" and
